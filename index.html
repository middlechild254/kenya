<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kenya Stay — Find Your Stay. Experience Kenya.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,560;0,9..144,650;1,9..144,440;1,9..144,560&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --forest:#152A20;
  --forest-2:#1F3A2C;
  --forest-3:#28483A;
  --sand:#E7DFC3;
  --paper:#F7F3E7;
  --paper-2:#FDFBF4;
  --clay:#A3462B;
  --clay-2:#BF5B3B;
  --gold:#B6902F;
  --gold-2:#D4AF5C;
  --teal:#2B655F;
  --teal-2:#3C8078;
  --ink:#1A1C16;
  --ink-soft:#4A4B41;
  --line:rgba(26,28,22,0.13);
  --line-soft:rgba(26,28,22,0.07);
  --white:#FFFEFA;
  --danger:#9C3B2E;
  --ok:#3B6B4A;
  --warn:#B6902F;
  --r-sm:3px;
  --r-md:6px;
  --shadow-card:0 1px 2px rgba(26,28,22,0.06), 0 8px 24px -12px rgba(26,28,22,0.18);
  --shadow-pop:0 20px 60px -20px rgba(21,42,32,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans', -apple-system, sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces', serif;
  font-weight:560;
  line-height:1.08;
  letter-spacing:-0.01em;
  margin:0;
  color:var(--ink);
}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
::selection{background:var(--gold-2);color:var(--forest);}
:focus-visible{outline:2px solid var(--teal-2);outline-offset:2px;}

.wrap{max-width:1240px;margin:0 auto;padding:0 32px;}
@media(max-width:760px){.wrap{padding:0 18px;}}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:2px;border:1px solid transparent;
  font-size:14px;font-weight:600;letter-spacing:0.01em;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--clay);color:var(--white);}
.btn-primary:hover{background:var(--clay-2);}
.btn-dark{background:var(--forest);color:var(--paper-2);}
.btn-dark:hover{background:var(--forest-2);}
.btn-gold{background:var(--gold);color:var(--white);}
.btn-gold:hover{background:var(--gold-2);}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink);}
.btn-outline-light{background:transparent;border-color:rgba(255,255,255,0.35);color:var(--paper-2);}
.btn-outline-light:hover{border-color:rgba(255,255,255,0.8);}
.btn-ghost{background:transparent;color:var(--ink-soft);padding:8px 10px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:9px 14px;font-size:13px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ============ HEADER ============ */
.site-header{
  position:sticky;top:0;z-index:60;
  background:var(--paper-2);
  border-bottom:1px solid var(--line);
}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;height:74px;gap:24px;}
.logo{display:flex;align-items:baseline;gap:8px;cursor:pointer;flex-shrink:0;}
.logo-mark{font-family:'Fraunces',serif;font-weight:650;font-size:22px;letter-spacing:-0.01em;color:var(--forest);}
.logo-sub{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--clay);font-weight:600;}
.main-nav{display:flex;align-items:center;gap:4px;flex:1;justify-content:center;}
.main-nav button{
  background:none;border:none;padding:9px 14px;font-size:13.5px;font-weight:500;
  color:var(--ink-soft);border-radius:20px;transition:all .15s;
}
.main-nav button:hover{color:var(--ink);background:var(--sand);}
.main-nav button.active{color:var(--forest);background:var(--sand);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.currency-select{
  border:1px solid var(--line);background:var(--white);padding:9px 10px;border-radius:2px;
  font-size:13px;font-weight:600;color:var(--ink-soft);
}
.hamburger-btn{display:none;background:none;border:1px solid var(--line);width:38px;height:38px;border-radius:2px;font-size:16px;color:var(--forest);}
.mobile-nav{display:none;flex-direction:column;gap:2px;padding:12px 32px 18px;border-top:1px solid var(--line);}
.mobile-nav button{background:none;border:none;text-align:left;padding:11px 8px;font-size:14.5px;font-weight:500;color:var(--ink-soft);border-radius:3px;}
.mobile-nav button.active{color:var(--forest);font-weight:700;background:var(--sand);}
.mobile-nav button.btn-primary{background:var(--clay);color:var(--white);text-align:center;font-weight:600;}
@media(max-width:900px){
  .main-nav{display:none;}
  .hamburger-btn{display:block;}
  .hide-mobile-cta{display:none;}
  .mobile-nav{display:flex;}
}

/* ============ HERO ============ */
.hero{background:var(--forest);color:var(--paper-2);position:relative;overflow:hidden;}
.hero::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 85% 15%, rgba(212,175,92,0.16), transparent 45%),
    radial-gradient(circle at 15% 90%, rgba(60,128,120,0.18), transparent 40%);
  pointer-events:none;
}
.hero-inner{position:relative;display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;padding:76px 0 0;align-items:center;}
@media(max-width:980px){.hero-inner{grid-template-columns:1fr;padding-top:48px;gap:32px;}}
.eyebrow-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--gold-2);font-weight:600;letter-spacing:0.04em;margin-bottom:22px;}
.eyebrow-tag .dot{width:5px;height:5px;border-radius:50%;background:var(--gold-2);}
.hero h1{font-size:56px;color:var(--white);max-width:640px;}
@media(max-width:640px){.hero h1{font-size:36px;}}
.hero .sub{margin-top:22px;font-size:18px;color:rgba(247,243,231,0.78);max-width:480px;line-height:1.6;}
.hero-photo-stack{position:relative;height:420px;}
.photo-block{
  position:absolute;border-radius:3px;overflow:hidden;
  display:flex;align-items:flex-end;padding:14px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
}
.photo-block .plabel{font-size:11px;color:rgba(255,255,255,0.92);font-weight:600;background:rgba(21,42,32,0.55);padding:4px 8px;border-radius:2px;backdrop-filter:blur(2px);}
.demo-badge{
  position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;letter-spacing:0.06em;
  background:rgba(21,42,32,0.75);color:var(--gold-2);padding:3px 6px;border-radius:2px;
}
@media(max-width:980px){.hero-photo-stack{height:280px;}}

/* search card */
.search-card{
  background:var(--white);border-radius:4px;box-shadow:var(--shadow-pop);
  padding:22px;margin-top:44px;position:relative;z-index:2;
  display:grid;grid-template-columns:1.3fr 1fr 1fr 0.9fr auto;gap:0;
}
.search-field{padding:6px 20px;border-right:1px solid var(--line);}
.search-field:first-child{padding-left:2px;}
.search-field:last-of-type{border-right:none;}
.search-field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
.search-field input,.search-field select{
  border:none;background:none;padding:0;font-size:14.5px;color:var(--ink);width:100%;font-family:inherit;font-weight:500;
}
.search-field input:focus,.search-field select:focus{outline:none;}
.search-card .btn{margin-left:14px;padding:0 26px;}
@media(max-width:980px){.search-card{grid-template-columns:1fr 1fr;gap:14px;padding:20px;}.search-field{border-right:none;border-bottom:1px solid var(--line);padding:10px 4px;}.search-card .btn{grid-column:1/-1;margin:6px 0 0;padding:14px;}}

/* ============ SECTION HEADERS ============ */
.section{padding:76px 0;}
.section-tight{padding:52px 0;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:36px;}
.section-head h2{font-size:32px;}
.section-head .sub{color:var(--ink-soft);margin-top:8px;font-size:15px;max-width:480px;}

/* ============ DESTINATIONS ============ */
.dest-scroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;}
.dest-card{
  flex:0 0 auto;width:220px;height:280px;border-radius:3px;position:relative;overflow:hidden;
  cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;
  transition:transform .2s ease;
}
.dest-card:hover{transform:translateY(-4px);}
.dest-card .dname{font-family:'Fraunces',serif;font-size:22px;color:var(--white);font-weight:560;}
.dest-card .dmeta{color:rgba(255,255,255,0.8);font-size:12px;margin-top:4px;}
.dest-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.55) 100%);}
.dest-card>*{position:relative;z-index:1;}

/* ============ PROPERTY CLASS CARDS ============ */
.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media(max-width:860px){.class-grid{grid-template-columns:1fr;}}
.class-card{
  background:var(--white);border:1px solid var(--line);border-left:4px solid var(--sand);
  padding:30px 26px;border-radius:2px;
}
.class-card.comfort{border-left-color:var(--teal-2);}
.class-card.premium{border-left-color:var(--gold);background:var(--forest);}
.class-card.premium h3,.class-card.premium p,.class-card.premium li{color:var(--paper-2);}
.class-card.premium .from-price{color:var(--gold-2);}
.class-card h3{font-size:22px;margin-bottom:6px;}
.class-card .tagline{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px;}
.class-card ul{list-style:none;padding:0;margin:0 0 22px;display:flex;flex-direction:column;gap:8px;}
.class-card li{font-size:13.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
.class-card li::before{content:"";width:4px;height:4px;background:currentColor;border-radius:50%;flex-shrink:0;}
.from-price{font-family:'Fraunces',serif;font-size:20px;font-weight:560;color:var(--forest);}
.from-price small{font-size:12px;font-weight:500;color:var(--ink-soft);}

/* ============ HOW IT WORKS ============ */
.steps-row{display:flex;gap:0;counter-reset:step;}
.step-item{flex:1;position:relative;padding-right:24px;}
.step-item:not(:last-child)::after{content:"";position:absolute;top:20px;right:0;width:24px;height:1px;background:var(--line);}
.step-num{font-family:'Fraunces',serif;font-size:15px;color:var(--clay);font-weight:650;margin-bottom:10px;}
.step-item h4{font-size:15.5px;margin-bottom:6px;}
.step-item p{font-size:13px;color:var(--ink-soft);}
@media(max-width:860px){.steps-row{flex-direction:column;gap:24px;}.step-item::after{display:none;}}

/* ============ CONCIERGE CTA ============ */
.concierge-band{background:var(--forest-3);color:var(--paper-2);border-radius:4px;padding:44px 44px;display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:center;}
@media(max-width:860px){.concierge-band{grid-template-columns:1fr;padding:32px 24px;}}
.concierge-band h2{color:var(--white);font-size:28px;}
.concierge-band p{color:rgba(247,243,231,0.75);margin-top:10px;max-width:440px;}
.concierge-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* ============ FOOTER ============ */
.site-footer{background:var(--forest);color:rgba(247,243,231,0.65);padding:56px 0 28px;margin-top:40px;}
.footer-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:40px;}
@media(max-width:760px){.footer-grid{grid-template-columns:1fr 1fr;}}
.footer-grid h5{color:var(--paper-2);font-size:12px;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:14px;font-weight:600;}
.footer-grid a{display:block;font-size:13.5px;padding:5px 0;color:rgba(247,243,231,0.65);}
.footer-grid a:hover{color:var(--gold-2);}
.footer-bottom{border-top:1px solid rgba(247,243,231,0.15);margin-top:40px;padding-top:22px;font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

/* ============ CARDS / BADGES generic ============ */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;}
.badge-verified{background:rgba(59,107,74,0.12);color:var(--ok);}
.badge-class-regular{background:var(--sand);color:var(--ink);}
.badge-class-comfort{background:rgba(60,128,120,0.14);color:var(--teal);}
.badge-class-premium{background:rgba(182,144,47,0.16);color:var(--gold);}
.badge-demo{background:rgba(163,70,43,0.1);color:var(--clay);}

/* ============ PROPERTY GRID CARDS ============ */
.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;}
.prop-card{background:var(--white);border:1px solid var(--line);border-radius:3px;overflow:hidden;box-shadow:var(--shadow-card);transition:transform .15s;cursor:pointer;}
.prop-card:hover{transform:translateY(-3px);}
.prop-photo{height:180px;position:relative;}
.prop-body{padding:16px 16px 18px;}
.prop-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
.prop-name{font-family:'Fraunces',serif;font-weight:560;font-size:16.5px;line-height:1.25;}
.prop-loc{color:var(--ink-soft);font-size:12.5px;margin-top:3px;}
.prop-rating{font-size:12.5px;font-weight:600;white-space:nowrap;}
.prop-meta{display:flex;gap:12px;font-size:12px;color:var(--ink-soft);margin:10px 0;}
.prop-price-row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line-soft);padding-top:12px;margin-top:4px;}
.prop-price{font-family:'Fraunces',serif;font-size:17px;font-weight:560;color:var(--forest);}
.prop-price small{font-size:11.5px;font-weight:500;color:var(--ink-soft);}
.compare-check{position:absolute;top:10px;left:10px;z-index:2;background:rgba(255,254,250,0.92);padding:5px 9px;border-radius:20px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;}

/* generic photo placeholder gradients used for demo images */
.ph{position:relative;width:100%;height:100%;background-size:cover;background-position:center;}

/* ============ FILTER SIDEBAR ============ */
.search-layout{display:grid;grid-template-columns:270px 1fr;gap:32px;align-items:start;}
@media(max-width:900px){.search-layout{grid-template-columns:1fr;}}
.filter-panel{background:var(--white);border:1px solid var(--line);border-radius:3px;padding:22px;position:sticky;top:96px;}
.filter-group{margin-bottom:22px;}
.filter-group:last-child{margin-bottom:0;}
.filter-group h4{font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:10px;font-weight:600;}
.filter-chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1px solid var(--line);background:var(--white);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:500;color:var(--ink-soft);}
.chip.active{background:var(--forest);color:var(--white);border-color:var(--forest);}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;color:var(--ink-soft);}
.range-row{display:flex;gap:8px;}
.range-row input{width:100%;border:1px solid var(--line);padding:8px 10px;border-radius:2px;font-size:13px;font-family:inherit;}
.select-basic{width:100%;border:1px solid var(--line);padding:9px 10px;border-radius:2px;font-size:13px;font-family:inherit;background:var(--white);}

/* ============ TABS ============ */
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto;}
.tabbar button{background:none;border:none;padding:12px 4px;margin-right:22px;font-size:13.5px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap;}
.tabbar button.active{color:var(--forest);border-bottom-color:var(--clay);}

/* ============ PROPERTY DETAIL ============ */
.detail-layout{display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:start;}
@media(max-width:980px){.detail-layout{grid-template-columns:1fr;}}
.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px;height:420px;border-radius:4px;overflow:hidden;margin-bottom:8px;}
.gallery .main-shot{position:relative;}
.gallery .side-shots{display:grid;grid-template-rows:1fr 1fr;gap:8px;}
.gallery .side-shots .ph{position:relative;}
.gallery .plabel{position:absolute;bottom:10px;left:10px;font-size:11.5px;color:#fff;background:rgba(21,42,32,0.55);padding:4px 9px;border-radius:2px;}
.view-all-photos{position:absolute;bottom:10px;right:10px;background:var(--white);padding:7px 12px;border-radius:2px;font-size:12px;font-weight:600;border:1px solid var(--line);}
@media(max-width:640px){.gallery{grid-template-columns:1fr;height:auto;}.gallery .side-shots{display:none;}.gallery .main-shot{height:260px;}}

.booking-panel{position:sticky;top:96px;background:var(--white);border:1px solid var(--line);border-radius:4px;padding:22px;box-shadow:var(--shadow-card);}
.bp-price{font-family:'Fraunces',serif;font-size:26px;font-weight:560;}
.bp-price small{font-size:13px;font-weight:500;color:var(--ink-soft);}
.bp-row{display:flex;justify-content:space-between;padding:9px 0;font-size:13.5px;border-bottom:1px solid var(--line-soft);}
.bp-row.total{border-bottom:none;border-top:1px solid var(--line);margin-top:6px;padding-top:14px;font-weight:700;font-size:15px;}
.bp-total-price{font-family:'Fraunces',serif;}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:2px;}
.stepper button{width:34px;height:34px;background:none;border:none;font-size:16px;color:var(--ink);}
.stepper span{flex:1;text-align:center;font-weight:600;font-size:14px;}
.field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:600;margin-bottom:6px;display:block;}
.radio-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;}
.radio-row:last-child{border-bottom:none;}
.radio-row .rname{font-weight:600;font-size:13.5px;}
.radio-row .rdesc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.radio-row .rprice{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap;}
.custom-radio,.custom-check{width:17px;height:17px;border:1.5px solid var(--line);border-radius:50%;flex-shrink:0;margin-top:2px;position:relative;}
.custom-check{border-radius:3px;}
.custom-radio.checked::after{content:"";position:absolute;inset:3px;background:var(--clay);border-radius:50%;}
.custom-check.checked{background:var(--clay);border-color:var(--clay);}
.custom-check.checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;}

.amenity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.amenity-item{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-soft);padding:8px 0;}
.verify-grid{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px;}
.verify-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ok);font-weight:600;}

.map-box{height:260px;border-radius:3px;background:var(--sand);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;border:1px solid var(--line);}
.map-grid-lines{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);background-size:32px 32px;opacity:.6;}
.map-pin{width:14px;height:14px;background:var(--clay);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 0 5px rgba(163,70,43,0.18);position:relative;z-index:1;}

.review-item{border-bottom:1px solid var(--line-soft);padding:18px 0;}
.review-item:first-child{padding-top:0;}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.avatar-circ{width:34px;height:34px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-family:'Fraunces',serif;}
.rating-bars{display:flex;flex-direction:column;gap:8px;}

function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }

const RATES = { KES:1, USD:1/129, GBP:1/163, EUR:1/140 };
const SYMS  = { KES:'KSh', USD:'$', GBP:'£', EUR:'€' };
function money(kes, currency){
  currency = currency || state.currency;
  const v = kes * RATES[currency];
  const dec = currency === 'KES' ? 0 : 0;
  return SYMS[currency] + ' ' + Math.round(v).toLocaleString('en-US', {maximumFractionDigits: dec});
}

  ['#8a6a2e','#3d2e10'], // dry gold
  ['#4a6b74','#1c2f33'], // dusk blue-grey
];
function gradFor(seed, i){
  const idx = (Math.abs(hash(seed)) + i) % PALETTES.length;
  const [a,b] = PALETTES[idx];
  const angle = 135 + (i*23 % 90);
  return `linear-gradient(${angle}deg, ${a}, ${b})`;
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++){ h = (h<<5)-h + s.charCodeAt(i); h|=0; } return h; }

function photoBlock(seed, i, label, opts){
  opts = opts || {};
  const style = `background:${gradFor(seed,i)};`;
  return `<div class="ph" style="${style}">
    <span class="demo-badge">DEMO IMAGE</span>
    ${label ? `<span class="plabel" style="position:absolute;bottom:10px;left:10px;">${esc(label)}</span>` : ''}
  </div>`;
}

function mapsLink(query){

function waLink(text){

function stars(rating){
  const full = Math.round(rating);
  return '★'.repeat(full) + '☆'.repeat(5-full);
}
function todayPlus(days){
  const d = new Date(); d.setDate(d.getDate()+days);
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

let activeTab = 'overview';

function computePackage(p, pkg){
  const nights = clamp(pkg.nights,1,60);
  const base = p.price * nights;
  let discountPct = 0;
  if(nights>=30) discountPct = 0.20;
  else if(nights>=7) discountPct = 0.10;
  const discount = Math.round(base*discountPct);
  const accommodation = base - discount;

  const mealPlan = MEAL_PLAN_LIB[pkg.mealPlan];
  const mealsCost = mealPlan.pppn * p.guests * nights;

  const transferCost = pkg.transfer ? 3500*2 : 0;
  const carRentalCost = pkg.carRental ? 6000 * nights : 0;
  const toursCost = pkg.tours.reduce((sum,tid)=>{
    const e = EXPERIENCES.find(x=>x.id===tid); return sum + (e?e.price:0);
  },0);

  const subtotal = accommodation + mealsCost + transferCost + carRentalCost + toursCost;
  const brokerFee = Math.round(subtotal * 0.12);
  const total = subtotal + brokerFee;

  return {nights, base, discountPct, discount, accommodation, mealPlan, mealsCost, transferCost, carRentalCost, toursCost, subtotal, brokerFee, total};
}

/* ------------------------------ EVENT DELEGATION ---------------------------- */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='nav'){ mobileNavOpen = false; navigate(t.dataset.view); return; }
  if(action==='toggle-mobile-nav'){ mobileNavOpen = !mobileNavOpen; render(); return; }
  if(action==='go-property'){ navigate('property', {id:t.dataset.id}); return; }
  if(action==='go-dest'){
    state.filters.dest = t.dataset.dest;
    navigate('search');
    return;
  }
  if(action==='toggle-compare'){
    e.stopPropagation();
    const id = t.dataset.id;
    const idx = state.compare.indexOf(id);
    if(idx>-1) state.compare.splice(idx,1);
    else { if(state.compare.length>=4){ toast('You can compare up to 4 stays at a time.'); return; } state.compare.push(id); }
    render();
    return;
  }
  if(action==='set-filter'){
    state.filters[t.dataset.key] = t.dataset.val;
    render(); return;
  }
  if(action==='reset-filters'){
    state.filters = { dest:'all', cls:'all', minPrice:0, maxPrice:60000, guests:1, amenities:[] };
    render(); return;
  }
  if(action==='toggle-amenity'){
    // handled on change event below for checkboxes; ignore click on label wrapper
    return;
  }
  if(action==='set-tab'){
    activeTab = t.dataset.tab;
    const p = PROPERTIES.find(x=>x.id===state.params.id) || PROPERTIES[0];
    document.getElementById('tabContent').innerHTML = renderTab(activeTab, p, computePackage(p, state.pkg), p.mealPlans.map(c=>MEAL_PLAN_LIB[c]));
    document.querySelectorAll('.tabbar button').forEach(b=> b.classList.toggle('active', b.dataset.tab===activeTab));
    return;
  }
  if(action==='pkg-nights'){
    state.pkg.nights = clamp(state.pkg.nights + parseInt(t.dataset.delta,10), 1, 60);
    render(); return;
  }
  if(action==='pkg-toggle'){
    // checkbox click bubbles here too; handled by change listener. no-op for the label click itself.
    return;
  }
  if(action==='toggle-tour'){
    const id = t.dataset.id;
    const idx = state.pkg.tours.indexOf(id);
    if(idx>-1) state.pkg.tours.splice(idx,1); else state.pkg.tours.push(id);
    render(); return;
  }
  if(action==='open-booking'){
    const p = PROPERTIES.find(x=>x.id===state.params.id) || PROPERTIES[0];
    openBookingModal(p, computePackage(p, state.pkg));
    return;
  }
  if(action==='close-modal'){ closeModal(); return; }
  if(action==='broker-tab'){ brokerTab = t.dataset.tab; render(); return; }
  if(action==='open-add-property'){ addPropertyModal(); return; }
  if(action==='noop'){ return; }
});

// modal overlay backdrop click to close
document.addEventListener('mousedown', function(e){
  if(e.target.id === 'modalOverlay') closeModal();
});

document.addEventListener('change', function(e){
  const el = e.target;

  if(el.id === 'currencySelect'){ state.currency = el.value; render(); return; }

  if(el.id === 'fDest'){ state.filters.dest = el.value; render(); return; }
  if(el.id === 'fMin'){ state.filters.minPrice = Number(el.value)||0; render(); return; }
  if(el.id === 'fMax'){ state.filters.maxPrice = Number(el.value)||99999999; render(); return; }
  if(el.id === 'fGuests'){ state.filters.guests = Number(el.value)||1; render(); return; }
  if(el.dataset && el.dataset.action==='toggle-amenity'){
    const val = el.dataset.val;
    const arr = state.filters.amenities;
    const idx = arr.indexOf(val);
    if(el.checked && idx===-1) arr.push(val);
    if(!el.checked && idx>-1) arr.splice(idx,1);
    render(); return;
  }

  if(el.id === 'pkgMealSelect'){ state.pkg.mealPlan = el.value; render(); return; }
  if(el.dataset && el.dataset.action==='pkg-toggle'){
    state.pkg[el.dataset.key] = el.checked; render(); return;
  }

  if(el.id === 'negHostPrice'){ negotiation.hostPrice = Number(el.value)||0; render(); return; }
  if(el.id === 'negNights'){ negotiation.nights = Number(el.value)||1; render(); return; }
  if(el.id === 'negCommission'){ negotiation.commissionPct = Number(el.value)||0; render(); return; }
  if(el.id === 'negExtras'){ negotiation.extras = Number(el.value)||0; render(); return; }
});

document.addEventListener('submit', function(e){
  e.preventDefault();
  const form = e.target;

  if(form.id === 'heroSearchForm'){
    const fd = new FormData(form);
    state.filters.dest = fd.get('dest') || 'all';
    state.filters.guests = Number(fd.get('guests'))||1;
    navigate('search');
    return;
  }

  if(form.id === 'tripRequestForm'){
    const fd = new FormData(form);
    const ref = `KS-2026-${Math.floor(100000+Math.random()*899999)}`;
    LEADS.unshift({
      id: ref, name: fd.get('name')||'Guest', from: fd.get('origin')||'\u2014',
      dest: fd.get('destination')||'\u2014', status:'New',
      budget: fd.get('budget')||'\u2014',
      dates: `${fd.get('arrival')||'?'} \u2192 ${fd.get('departure')||'?'}`,
    });
    navigate('home');
    toast(`Trip request submitted \u2014 reference ${ref}. Our concierge will be in touch.`);
    return;
  }

  if(form.id === 'bookingForm'){
    const fd = new FormData(form);
    const p = PROPERTIES.find(x=>x.id===state.params.id) || PROPERTIES[0];
    const calc = computePackage(p, state.pkg);
    state.lastBooking = {
      bookingId: `KS-2026-${Math.floor(100000+Math.random()*899999)}`,
      guestName: fd.get('guestName') || 'Guest',
      property: p, calc,
      checkin: todayPlus(14),
      checkout: todayPlus(14 + calc.nights),
    };
    closeModal();
    navigate('confirmation');
    return;
  }

  if(form.id === 'addPropertyForm'){
    closeModal();
    toast('Property submitted \u2014 our team will verify photos, location and host identity before it goes live.');
    return;
  }
});

/* ------------------------------ INIT ----------------------------------------- */
render();

</script>
